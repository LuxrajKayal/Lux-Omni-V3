name: One-time vendor source verification

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify-vendor-sources:
    if: contains(github.event.head_commit.message, '[run-vendor-verify]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Lux Omni
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Restore all upstream-tracked files and verify exact coverage
        shell: bash
        env:
          PDFJS_COMMIT: fcde2e1f9a960e9d234caea43746d6223cd054df
          PDFLIB_COMMIT: 93dd36e85aa659a3bca09867d2d8fac172501fbe
        run: |
          set -euo pipefail

          clone_at_commit() {
            local url="$1"
            local commit="$2"
            local destination="$3"
            mkdir -p "$destination"
            git -C "$destination" init
            git -C "$destination" remote add origin "$url"
            git -C "$destination" fetch --depth=1 origin "$commit"
            git -C "$destination" checkout --detach FETCH_HEAD
            test "$(git -C "$destination" rev-parse HEAD)" = "$commit"
          }

          clone_at_commit https://github.com/mozilla/pdf.js.git "$PDFJS_COMMIT" "$RUNNER_TEMP/pdfjs-source"
          clone_at_commit https://github.com/Hopding/pdf-lib.git "$PDFLIB_COMMIT" "$RUNNER_TEMP/pdf-lib-source"

          mkdir -p site/vendor/pdf.js site/vendor/pdf-lib
          rsync -a --delete --exclude='/.git' "$RUNNER_TEMP/pdfjs-source/" site/vendor/pdf.js/
          rsync -a --delete --exclude='/.git' "$RUNNER_TEMP/pdf-lib-source/" site/vendor/pdf-lib/

          pdfjs_expected="$(git -C "$RUNNER_TEMP/pdfjs-source" ls-tree -r --name-only HEAD | wc -l | tr -d ' ')"
          pdflib_expected="$(git -C "$RUNNER_TEMP/pdf-lib-source" ls-tree -r --name-only HEAD | wc -l | tr -d ' ')"
          pdfjs_actual="$(find site/vendor/pdf.js -mindepth 1 \( -type f -o -type l \) | wc -l | tr -d ' ')"
          pdflib_actual="$(find site/vendor/pdf-lib -mindepth 1 \( -type f -o -type l \) | wc -l | tr -d ' ')"

          echo "PDF.js expected tracked files: $pdfjs_expected; copied files: $pdfjs_actual"
          echo "pdf-lib expected tracked files: $pdflib_expected; copied files: $pdflib_actual"
          test "$pdfjs_expected" = "$pdfjs_actual"
          test "$pdflib_expected" = "$pdflib_actual"
          test ! -d site/vendor/pdf.js/.git
          test ! -d site/vendor/pdf-lib/.git

          cat > site/vendor/README.md <<'VENDOR_README'
          # Third-party libraries

          ## Current status

          Neither library is currently used by Lux Omni. The complete upstream repositories are stored here for evaluation only. No application imports, runtime loading, PDF viewing, PDF editing, or worker configuration has been implemented.

          ## Order of consideration

          1. **PDF.js (Mozilla) — primary choice.** Evaluate first for PDF loading, parsing, rendering, and viewing inside Lux Omni.
          2. **pdf-lib (Hopding) — optional secondary library.** Consider only if a required PDF creation or modification feature cannot be provided appropriately by the chosen PDF.js workflow.
          3. **Remove what is not needed.** If pdf-lib proves unnecessary, delete `site/vendor/pdf-lib/` from Lux Omni. Its upstream repository remains available at the link below.

          ## Imported upstream snapshots

          - PDF.js: https://github.com/mozilla/pdf.js — commit `fcde2e1f9a960e9d234caea43746d6223cd054df` — Apache-2.0
          - pdf-lib: https://github.com/Hopding/pdf-lib — commit `93dd36e85aa659a3bca09867d2d8fac172501fbe` — MIT

          The library source files and upstream documentation are copied from the pinned upstream commits without application-specific edits. Git metadata is not included. Each library's own README and license files are preserved inside its directory.

          ## Integration reminder

          Having source code in this folder does **not** make either library active in the website. Select and configure suitable browser-ready build files and, for PDF.js, its matching worker before use. Do not wire either library into the app until implementation is explicitly planned and tested.
          VENDOR_README

          cat >> docs/BUILD_LOG.md <<'BUILD_LOG_ENTRY'

          ## 2026-10-15 — Verify and complete upstream library import

          - Re-synchronized both vendor directories from the pinned upstream commits to include every tracked upstream file, including files ignored by the parent repository's default Git rules.
          - PDF.js source commit: `fcde2e1f9a960e9d234caea43746d6223cd054df`.
          - pdf-lib source commit: `93dd36e85aa659a3bca09867d2d8fac172501fbe`.
          - The import step verifies copied file counts against each source Git tree before committing.
          - Updated `site/vendor/README.md` using a literal heredoc to preserve all Markdown and commit IDs.
          - Both libraries remain unused by application code.
          BUILD_LOG_ENTRY

          # Remove this temporary workflow from the final project tree.
          rm -f .github/workflows/verify-vendor-sources.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- docs/BUILD_LOG.md site/vendor/README.md .github/workflows/verify-vendor-sources.yml
          git add -f -A -- site/vendor/pdf.js site/vendor/pdf-lib
          git commit -m "Include every upstream-tracked PDF library file"
          git push origin HEAD:main
