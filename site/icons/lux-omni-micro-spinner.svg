<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
  <style>
    .micro-top {
      animation: micro-wave 1.6s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }
    .micro-mid {
      animation: micro-wave 1.6s cubic-bezier(0.45, 0, 0.55, 1) -0.18s infinite;
    }
    .micro-bot {
      animation: micro-wave 1.6s cubic-bezier(0.45, 0, 0.55, 1) -0.36s infinite;
    }
    @keyframes micro-wave {
      0%, 85%, 100% {
        transform: translateY(0px);
        opacity: 1;
      }
      45% {
        transform: translateY(-1.5px);
        opacity: 0.4;
      }
    }
  </style>

  <!-- Top Layer: Split-Screen "L + O" -->
  <g class="micro-top">
    <path d="M 12 2.5 L 15.2 4.3 L 8.8 8 L 15.2 11.7 L 12 13.5 L 2 8 Z" />
    <path opacity="0.75" d="M 17 5.3 L 22 8 L 17 10.7 L 13.8 8.9 L 15.5 8 L 13.8 7.1 Z" />
  </g>

  <!-- Middle Layer -->
  <path class="micro-mid" opacity="0.65"
        d="M 12 17.5 L 2 12 L 4.5 10.6 L 12 14.7 L 19.5 10.6 L 22 12 Z" />

  <!-- Bottom Layer -->
  <path class="micro-bot" opacity="0.4"
        d="M 12 21.5 L 2 16 L 4.5 14.6 L 12 18.7 L 19.5 14.6 L 22 16 Z" />
</svg>