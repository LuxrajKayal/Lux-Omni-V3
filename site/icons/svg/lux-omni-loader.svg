<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <style>
    :root {
      --lux-speed: 2.4s;
      --lux-ease: cubic-bezier(0.65, 0, 0.35, 1);
    }

    .layer-bottom {
      animation: pulse-bottom var(--lux-speed) var(--lux-ease) infinite;
      transform-origin: 128px 164px;
      will-change: transform, opacity;
    }

    .layer-middle {
      animation: pulse-middle var(--lux-speed) var(--lux-ease) infinite;
      transform-origin: 128px 128px;
      will-change: transform, filter;
    }

    .layer-top-group {
      animation: pulse-top var(--lux-speed) var(--lux-ease) infinite;
      transform-origin: 128px 92px;
      will-change: transform;
    }

    .wing-lux {
      animation: dock-left var(--lux-speed) var(--lux-ease) infinite;
      will-change: transform;
    }

    .wing-module {
      animation: dock-right var(--lux-speed) var(--lux-ease) infinite;
      will-change: transform, opacity;
    }

    .nexus-pillar {
      animation: core-flow var(--lux-speed) var(--lux-ease) infinite;
      transform-origin: 128px 120px;
      will-change: transform, opacity;
    }

    .nexus-cap {
      animation: cap-flash var(--lux-speed) var(--lux-ease) infinite;
      transform-origin: 128px 72px;
      will-change: transform, opacity, filter;
    }

    .ambient-glow {
      animation: glow-pulse var(--lux-speed) var(--lux-ease) infinite;
      transform-origin: 128px 128px;
    }

    /* 1. Bottom Layer: Descends on expansion, rises to lock */
    @keyframes pulse-bottom {
      0%, 85%, 100% {
        transform: translateY(0px);
        opacity: 0.95;
      }
      40% {
        transform: translateY(14px);
        opacity: 0.55;
      }
    }

    /* 2. Middle Layer: Subtle harmonic stabilizer */
    @keyframes pulse-middle {
      0%, 85%, 100% {
        transform: translateY(0px) scale(1);
        filter: brightness(1.1);
      }
      40% {
        transform: translateY(2px) scale(0.97);
        filter: brightness(0.9);
      }
    }

    /* 3. Top Layer Group: Ascends on expansion, descends to lock */
    @keyframes pulse-top {
      0%, 85%, 100% {
        transform: translateY(0px);
      }
      40% {
        transform: translateY(-14px);
      }
    }

    /* 4. Split-Screen Docking: L-Wing and Module separate, then snap together */
    @keyframes dock-left {
      0%, 80%, 100% {
        transform: translateX(0px);
      }
      40% {
        transform: translateX(-4px);
      }
    }

    @keyframes dock-right {
      0%, 80%, 100% {
        transform: translateX(0px);
        opacity: 1;
      }
      40% {
        transform: translateX(7px);
        opacity: 0.8;
      }
    }

    /* 5. Central Nexus Pillar: Surges upward as layers align */
    @keyframes core-flow {
      0%, 100% {
        opacity: 0.9;
        transform: scaleY(1);
      }
      40% {
        opacity: 0.35;
        transform: scaleY(1.12);
      }
      75% {
        opacity: 1;
        transform: scaleY(0.98);
      }
    }

    /* 6. Top Cap: Crisp illumination flash when alignment locks (70%-85%) */
    @keyframes cap-flash {
      0%, 60%, 100% {
        transform: translateY(0px) scale(1);
        opacity: 0.85;
      }
      40% {
        transform: translateY(-10px) scale(0.85);
        opacity: 0.4;
      }
      78% {
        transform: translateY(0px) scale(1.12);
        opacity: 1;
      }
    }

    @keyframes glow-pulse {
      0%, 80%, 100% {
        opacity: 0.35;
        transform: scale(1);
      }
      40% {
        opacity: 0.12;
        transform: scale(0.85);
      }
    }

    /* Accessibility: Respect OS Reduced Motion Settings */
    @media (prefers-reduced-motion: reduce) {
      .layer-bottom, .layer-middle, .layer-top-group,
      .wing-lux, .wing-module, .nexus-pillar, .nexus-cap {
        animation: none !important;
        transform: none !important;
      }
      .nexus-pillar {
        animation: glow-pulse 3s ease-in-out infinite !important;
      }
    }
  </style>

  <defs>
    <!-- Ambient Core Backlight -->
    <radialGradient id="core-backlight" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#2563EB" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>

    <!-- Bottom Layer: Foundation -->
    <linearGradient id="layer-bottom-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Middle Layer: Unified Ecosystem -->
    <linearGradient id="layer-middle-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Top Layer "L" Wing: Lux Illumination -->
    <linearGradient id="layer-top-lux-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Top Layer Split Module -->
    <linearGradient id="layer-top-mod-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Central Nexus Axis Glow -->
    <linearGradient id="nexus-core-grad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.15" />
    </linearGradient>

    <!-- Soft Elevation Shadow -->
    <filter id="elevation-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#020617" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Subtle Radial Backlight -->
  <circle class="ambient-glow" cx="128" cy="128" r="96" fill="url(#core-backlight)" />

  <!-- LAYER 1 (BOTTOM): Storage & Foundation Layer -->
  <g class="layer-bottom" filter="url(#elevation-shadow)">
    <path fill="url(#layer-bottom-grad)" fill-rule="evenodd"
          d="M 128 116 L 212 164 L 128 212 L 44 164 Z 
             M 128 148 L 156 164 L 128 180 L 100 164 Z" />
  </g>

  <!-- LAYER 2 (MIDDLE): Unified Ecosystem O-Ring -->
  <g class="layer-middle" filter="url(#elevation-shadow)">
    <path fill="url(#layer-middle-grad)" fill-rule="evenodd"
          d="M 128 80 L 212 128 L 128 176 L 44 128 Z 
             M 128 112 L 156 128 L 128 144 L 100 128 Z" />
  </g>

  <!-- CENTRAL NEXUS AXIS: Vertical Pillar Binding the Layers -->
  <g class="nexus-pillar">
    <path fill="url(#nexus-core-grad)" opacity="0.85"
          d="M 114 72 L 128 80 L 128 168 L 114 160 Z" />
    <path fill="url(#nexus-core-grad)" opacity="0.55"
          d="M 142 72 L 128 80 L 128 168 L 142 160 Z" />
  </g>

  <!-- Top Diamond Cap of Nexus Core -->
  <path class="nexus-cap" fill="#ECFEFF"
        d="M 128 64 L 142 72 L 128 80 L 114 72 Z" />

  <!-- LAYER 3 (TOP): Split-Screen "L + O" Workspace -->
  <g class="layer-top-group" filter="url(#elevation-shadow)">
    <!-- Primary "L" Structural Wing (Lux) -->
    <path class="wing-lux" fill="url(#layer-top-lux-grad)"
          d="M 128 44 L 156 60 L 100 92 L 156 124 L 128 140 L 44 92 Z" />
    <!-- Secondary Split-Screen Module (Completes the "O" Silhouette) -->
    <path class="wing-module" fill="url(#layer-top-mod-grad)"
          d="M 163 64 L 212 92 L 163 120 L 135 104 L 156 92 L 135 76 Z" />
  </g>
</svg>