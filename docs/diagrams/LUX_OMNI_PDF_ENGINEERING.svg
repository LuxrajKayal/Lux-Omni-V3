<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">Lux Omni PDF Engineering Block Diagram</title>
  <desc id="diagram-description">Planned architecture showing a PDF file entering the Lux Omni pipeline, PDF.js as the primary viewing and rendering engine, the workspace viewport, and an optional pdf-lib path for programmatic PDF modifications before saving or downloading. Neither library is currently integrated.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L11,6 L1,11 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L11,6 L1,11 Z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L11,6 L1,11 Z" fill="#b45309"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #172033; }
      .title { font-size: 32px; font-weight: 750; letter-spacing: .2px; }
      .subtitle { font-size: 16px; fill: #526174; }
      .section { font-size: 15px; font-weight: 750; letter-spacing: 1.4px; fill: #526174; }
      .box-title { font-size: 21px; font-weight: 700; }
      .body { font-size: 16px; fill: #344256; }
      .small { font-size: 14px; fill: #526174; }
      .tiny { font-size: 12px; fill: #526174; }
      .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 14px; fill: #344256; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.7; }
      .blue-panel { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
      .green-panel { fill: #f0fdfa; stroke: #5eead4; stroke-width: 2; }
      .amber-panel { fill: #fffbeb; stroke: #fbbf24; stroke-width: 2; }
      .gray-panel { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.6; }
      .connector { fill: none; stroke: #2563eb; stroke-width: 3; marker-end: url(#arrow-blue); }
      .optional-connector { fill: none; stroke: #b45309; stroke-width: 3; stroke-dasharray: 8 7; marker-end: url(#arrow-amber); }
      .save-connector { fill: none; stroke: #0f766e; stroke-width: 3; marker-end: url(#arrow-green); }
      .rule { stroke: #dbe3ee; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1800" height="1180" fill="#f1f5f9"/>
  <rect x="32" y="28" width="1736" height="1124" rx="24" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.5"/>

  <text x="72" y="88" class="title">LUX OMNI — PDF ENGINEERING BLOCK DIAGRAM</text>
  <text x="72" y="122" class="subtitle">Planned integration path • browser application • vendor sources preserved as upstream snapshots</text>
  <rect x="1392" y="58" width="318" height="42" rx="21" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <circle cx="1415" cy="79" r="6" fill="#c2410c"/>
  <text x="1432" y="85" font-size="14" font-weight="750" fill="#9a3412">NOT YET INTEGRATED</text>

  <line x1="72" y1="148" x2="1710" y2="148" class="rule"/>
  <text x="72" y="181" class="section">A. PRIMARY VIEW / RENDER PATH</text>

  <!-- User file input -->
  <rect x="72" y="214" width="294" height="256" rx="16" class="panel"/>
  <rect x="72" y="214" width="294" height="48" rx="16" fill="#e2e8f0"/>
  <path d="M72 246 V262 H366 V246" fill="#e2e8f0"/>
  <text x="94" y="245" class="box-title">1. PDF source</text>
  <g transform="translate(100 286)" fill="none" stroke="#64748b" stroke-width="2.2">
    <path d="M0 0 H54 L72 18 V82 H0 Z"/>
    <path d="M54 0 V18 H72"/>
    <path d="M13 39 H57 M13 51 H57 M13 63 H48"/>
  </g>
  <text x="190" y="304" class="body">Local file</text>
  <text x="190" y="330" class="body">or configured provider</text>
  <text x="94" y="400" class="small">Output: original PDF bytes</text>
  <text x="94" y="424" class="small">Input selection is an application</text>
  <text x="94" y="445" class="small">responsibility, not a PDF.js feature.</text>

  <!-- Orchestration boundary -->
  <rect x="414" y="214" width="348" height="256" rx="16" class="blue-panel"/>
  <rect x="414" y="214" width="348" height="48" rx="16" fill="#dbeafe"/>
  <path d="M414 246 V262 H762 V246" fill="#dbeafe"/>
  <text x="436" y="245" class="box-title">2. Lux Omni pipeline</text>
  <text x="440" y="294" class="mono">FileManager</text>
  <text x="440" y="326" class="mono">ViewportLoader</text>
  <text x="440" y="358" class="mono">PdfAdapter (planned boundary)</text>
  <line x1="440" y1="377" x2="736" y2="377" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="440" y="405" class="small">Classify the file, route PDF bytes,</text>
  <text x="440" y="428" class="small">manage lifecycle and pass data to</text>
  <text x="440" y="451" class="small">the engine through one adapter.</text>

  <!-- PDF.js -->
  <rect x="824" y="194" width="370" height="296" rx="16" class="green-panel"/>
  <rect x="824" y="194" width="370" height="50" rx="16" fill="#ccfbf1"/>
  <path d="M824 228 V244 H1194 V228" fill="#ccfbf1"/>
  <text x="848" y="226" class="box-title">3. PDF.js — primary engine</text>
  <text x="850" y="278" class="body">Parse PDF data</text>
  <text x="850" y="309" class="body">Use matching PDF.js worker</text>
  <text x="850" y="340" class="body">Render page surfaces</text>
  <text x="850" y="371" class="body">Expose text / document data</text>
  <line x1="850" y1="390" x2="1168" y2="390" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="850" y="418" class="small">Vendored source: 2,597 tracked files</text>
  <text x="850" y="441" class="small">Browser build + worker setup still required</text>
  <text x="850" y="464" class="small">before runtime use.</text>

  <!-- Viewport output -->
  <rect x="1256" y="214" width="454" height="256" rx="16" class="panel"/>
  <rect x="1256" y="214" width="454" height="48" rx="16" fill="#e2e8f0"/>
  <path d="M1256 246 V262 H1710 V246" fill="#e2e8f0"/>
  <text x="1280" y="245" class="box-title">4. Lux Omni workspace viewport</text>
  <rect x="1280" y="284" width="405" height="109" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="1295" y="298" width="110" height="80" rx="4" fill="#dbeafe" stroke="#93c5fd"/>
  <path d="M1307 315 H1392 M1307 329 H1392 M1307 343 H1383 M1307 357 H1376" stroke="#64748b" stroke-width="2"/>
  <rect x="1420" y="298" width="248" height="20" rx="4" fill="#e2e8f0"/>
  <rect x="1420" y="326" width="216" height="9" rx="4" fill="#cbd5e1"/>
  <rect x="1420" y="342" width="232" height="9" rx="4" fill="#cbd5e1"/>
  <rect x="1420" y="358" width="190" height="9" rx="4" fill="#cbd5e1"/>
  <text x="1280" y="421" class="small">Canvas/page UI + text/search layer + controls</text>
  <text x="1280" y="444" class="small">Implemented by Lux Omni, not copied from pdf-lib.</text>

  <!-- Primary sequence connectors -->
  <path d="M366 340 H404" class="connector"/>
  <path d="M762 340 H814" class="connector"/>
  <path d="M1194 340 H1246" class="connector"/>
  <text x="380" y="320" class="tiny">PDF bytes</text>
  <text x="773" y="320" class="tiny">load</text>
  <text x="1200" y="320" class="tiny">render</text>

  <line x1="72" y1="518" x2="1710" y2="518" class="rule"/>
  <text x="72" y="552" class="section">B. OPTIONAL PDF WRITE PATH — ONLY IF A REQUIREMENT NEEDS IT</text>

  <!-- Optional library -->
  <rect x="414" y="582" width="348" height="218" rx="16" class="amber-panel"/>
  <rect x="414" y="582" width="348" height="48" rx="16" fill="#fef3c7"/>
  <path d="M414 614 V630 H762 V614" fill="#fef3c7"/>
  <text x="436" y="613" class="box-title">5. pdf-lib — optional</text>
  <text x="440" y="657" class="body">Load bytes for supported writes</text>
  <text x="440" y="686" class="body">Create / modify / serialize PDF</text>
  <line x1="440" y1="705" x2="736" y2="705" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="440" y="734" class="small">Vendored source: 759 tracked files</text>
  <text x="440" y="757" class="small">Not a viewer; feature coverage must be</text>
  <text x="440" y="780" class="small">checked before adopting.</text>

  <!-- Save and verify -->
  <rect x="824" y="582" width="370" height="218" rx="16" class="green-panel"/>
  <rect x="824" y="582" width="370" height="48" rx="16" fill="#ccfbf1"/>
  <path d="M824 614 V630 H1194 V614" fill="#ccfbf1"/>
  <text x="848" y="613" class="box-title">6. Validate exported bytes</text>
  <text x="850" y="657" class="body">Export Uint8Array / PDF bytes</text>
  <text x="850" y="686" class="body">Reopen through PDF.js</text>
  <text x="850" y="715" class="body">Check target pages and changes</text>
  <line x1="850" y1="735" x2="1168" y2="735" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="850" y="762" class="small">Only report success after verification.</text>

  <rect x="1256" y="582" width="454" height="218" rx="16" class="panel"/>
  <rect x="1256" y="582" width="454" height="48" rx="16" fill="#e2e8f0"/>
  <path d="M1256 614 V630 H1710 V614" fill="#e2e8f0"/>
  <text x="1280" y="613" class="box-title">7. Save / download boundary</text>
  <text x="1280" y="658" class="mono">DownloadService</text>
  <text x="1280" y="688" class="mono">SyncManager / provider adapters</text>
  <line x1="1280" y1="706" x2="1685" y2="706" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1280" y="733" class="small">Original bytes when no rewrite is needed;</text>
  <text x="1280" y="756" class="small">updated bytes only after successful verification.</text>
  <text x="1280" y="780" class="small">Provider paths must be separately configured.</text>

  <!-- Optional flow connectors -->
  <path d="M590 470 V540 H590 V572" class="optional-connector"/>
  <text x="608" y="536" class="tiny" fill="#92400e">Only if needed</text>
  <path d="M762 690 H814" class="optional-connector"/>
  <path d="M1194 690 H1246" class="save-connector"/>
  <text x="772" y="672" class="tiny">modified bytes</text>
  <text x="1201" y="672" class="tiny">verified bytes</text>

  <!-- Original-byte no-rewrite branch -->
  <path d="M216 470 V840 H1480 V810" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrow-blue)"/>
  <rect x="550" y="823" width="470" height="32" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="785" y="844" text-anchor="middle" class="small">No rewrite required → retain original bytes for download/save</text>

  <!-- Engineering notes -->
  <line x1="72" y1="881" x2="1710" y2="881" class="rule"/>
  <text x="72" y="916" class="section">ENGINEERING NOTES / CURRENT READINESS</text>

  <rect x="72" y="940" width="510" height="155" rx="12" class="gray-panel"/>
  <text x="94" y="974" class="box-title">Vendor integrity</text>
  <text x="94" y="1005" class="small">PDF.js source pinned to:</text>
  <text x="94" y="1028" class="mono">fcde2e1f9a960e9d234caea43746d6223cd054df</text>
  <text x="94" y="1056" class="small">pdf-lib source pinned to:</text>
  <text x="94" y="1079" class="mono">93dd36e85aa659a3bca09867d2d8fac172501fbe</text>

  <rect x="610" y="940" width="510" height="155" rx="12" class="gray-panel"/>
  <text x="632" y="974" class="box-title">Before enabling the viewer</text>
  <text x="632" y="1005" class="small">1. Build/select the browser-ready PDF.js distribution.</text>
  <text x="632" y="1031" class="small">2. Configure the matching worker path.</text>
  <text x="632" y="1057" class="small">3. Implement and test the PdfAdapter contract.</text>
  <text x="632" y="1081" class="small">4. Test open → render → close with sample PDFs.</text>

  <rect x="1148" y="940" width="562" height="155" rx="12" class="gray-panel"/>
  <text x="1170" y="974" class="box-title">Rules / boundaries</text>
  <text x="1170" y="1005" class="small">• Neither library is presently active in Lux Omni.</text>
  <text x="1170" y="1031" class="small">• PDF.js renders; pdf-lib is only a conditional writer.</text>
  <text x="1170" y="1057" class="small">• Never overwrite source bytes without user intent.</text>
  <text x="1170" y="1081" class="small">• Keep storage, rendering, and editing responsibilities separate.</text>

  <text x="72" y="1127" class="tiny">LUX OMNI • SOFTWARE ENGINEERING DRAWING • NOT A CLAIM OF IMPLEMENTED FUNCTIONALITY</text>
  <text x="1710" y="1127" class="tiny" text-anchor="end">DOC: PDF-ARCH-001 • REV A • 2026-10-15</text>
</svg>
